name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Migration, tests and style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, curl, zip, gd
          coverage: none

      - name: Install dependencies from lock file
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare local environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php artisan test --compact

      - name: Check formatting
        run: php vendor/bin/pint --test
